[package]
name = "legacy-ios-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
flate2 = "=1.1.10"
futures-util = "0.3.31"
legacy-ios-assets = { path = "../assets" }
legacy-ios-core = { path = "../core" }
legacy-ios-exploits = { path = "../exploits" }
legacy-ios-firmware = { path = "../firmware" }
legacy-ios-image = { path = "../image" }
legacy-ios-restore = { path = "../restore" }
legacy-ios-services = { path = "../services" }
legacy-ios-transport = { path = "../transport" }
legacy-ios-workflows = { path = "../workflows" }
plist = "=1.10.0"
serde.workspace = true
tempfile = "3.20.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = "0.7.19"
sha1 = "=0.10.6"
tracing.workspace = true
uuid = { version = "=1.26.0", features = ["v4"] }
zeroize = "=1.9.0"

[lints]
workspace = true

[dev-dependencies]
hfsplus = { version = "=0.2.4", features = ["testutil"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
