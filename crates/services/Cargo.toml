[package]
name = "legacy-ios-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
idevice = { version = "=0.1.65", default-features = false, features = ["afc", "diagnostics_relay", "house_arrest", "pair", "ring", "syslog_relay", "usbmuxd"] }
legacy-ios-core = { path = "../core" }
legacy-ios-transport = { path = "../transport" }
nusb = { version = "=0.2.7", features = ["tokio"] }
plist = "=1.10.0"
russh = { version = "=0.63.1", default-features = false, features = ["des", "dsa", "ring", "rsa"] }
rusbmux = { version = "=0.2.0", default-features = false, features = ["nusb"] }
serde.workspace = true
thiserror.workspace = true
time = "=0.3.47"
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
uuid = { version = "1.16.0", features = ["v4"] }
zeroize = "=1.9.0"

[lints]
workspace = true
